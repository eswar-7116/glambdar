syntax = "proto3";
package glambdar;
option go_package = "github.com/eswar-7116/glambdar/v3/proto";

service GlambdarAgent {
    rpc Invoke(InvokeRequest) returns (InvokeResponse);
    rpc PreloadFunction(PreloadRequest) returns (PreloadResponse);
    rpc EvictFunction(EvictRequest) returns (EvictResponse);
    rpc GetStatus(StatusRequest) returns (StatusResponse);
}

message InvokeRequest {
    string func_name = 1;
    string method = 2;
    map<string, string> headers = 3;
    bytes body = 4;
}

message InvokeResponse {
    int32 status_code = 1;
    map<string, string> headers = 2;
    bytes body = 3;
    bool cold_start = 4;
}

message PreloadRequest { string func_name = 1; }
message PreloadResponse { bool success = 1; string message = 2; }

message EvictRequest { string func_name = 1; }
message EvictResponse { bool success = 1; }

message StatusRequest {}
message StatusResponse {
    string node_id = 1;
    map<string, PoolStatus> pools = 2;
    double cpu_available = 3;
    int64 memory_available = 4;
}

message PoolStatus {
    int32 idle_count = 1;
    int32 active_count = 2;
    int32 max_concurrency = 3;
}
