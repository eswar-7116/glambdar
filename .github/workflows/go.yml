name: Go

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"

jobs:

  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_DB: glambdar
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d glambdar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.5'
    
    - name: Install gVisor
      run: |
        (
          set -e
          ARCH=$(uname -m)
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}
          wget ${URL}/gvisor.tar.zstd ${URL}/gvisor.tar.zstd.sha512
          sha512sum -c gvisor.tar.zstd.sha512
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          rm -f gvisor.tar.zstd gvisor.tar.zstd.sha512
        )
        sudo /usr/local/bin/runsc install
        sudo systemctl reload docker

    - name: Build
      run: go build -v ./...

    - name: Unit and Integration Tests
      env:
        TEST_DSN: postgres://test@localhost:5432/glambdar?sslmode=disable
        RUN_INTEGRATION_TESTS: 1
      run: go test -v -race -count=1 ./...
